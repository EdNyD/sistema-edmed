<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- ✅ Mejora: Eliminado user-scalable=no para cumplir con reglas de accesibilidad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Sistema de gestión de prórrogas">
    <title>Sistema de Prórrogas</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0f1e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 25px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Sistema de Prórrogas</h1>
        <p>Acceso al sistema académico</p>

        <!-- ✅ Mejora: Se agregó href="#" para que los lectores de pantalla lo reconozcan desde el inicio -->
        <a id="btn-acceder" class="btn" target="_top" href="#">
            Ingresar
        </a>
    </div>

    <script>
        // 🔥 TU LINK DE APPS SCRIPT
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzQRQJxbXNYbut65BILKNkOob9-jAU0H3tgZ-hGE6vA1tkpAi2avtjA3riE092KyjLR/exec";

        // Asignar SIEMPRE con anti-cache usando template literals (más moderno)
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('btn-acceder');
            if (btn) {
                btn.href = `${GAS_URL}?v=${Date.now()}`;
            }
        });

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            // ✅ Mejora: Retrasar la instalación al evento 'load' para priorizar que la pantalla pinte el HTML a máxima velocidad
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('SW registrado correctamente:', registration.scope))
                    .catch(error => console.error('Error al registrar SW:', error));
            });
        }
    </script>
</body>
</html>
