<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Sistema de Prórrogas</title>

    <link rel="icon" href="icon-192.png">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
        }

        h1 { margin-bottom: 10px; font-size: 2rem; }
        p { color: #94a3b8; margin-bottom: 30px; }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        /* Indicador de Versión para control visual */
        .version-tag {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Sistema de Prórrogas</h1>
        <p>Acceso directo al sistema académico</p>

        <a id="btn-acceder" class="btn" target="_top" href="#">
            Ingresar al Sistema
        </a>
    </div>

    <div class="version-tag">v2.0.1 - Sin Caché</div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyeqpjMyRtwvplHuDs_moyTOZQUs5jKaoYosarrqXnj_vpKzCTUCdVKj2ww7qxtZaEp/exec";

        // 1. Configurar el botón con anti-caché para el destino
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('btn-acceder');
            if (btn) {
                btn.href = `${GAS_URL}?v=${Date.now()}`;
            }
        });

        // 2. Limpieza total y forzada de cualquier Service Worker previo
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (let registration of registrations) {
                    registration.unregister().then(() => {
                        console.log('Cache antiguo limpiado con éxito.');
                        // Borrar memorias de almacenamiento
                        if (window.caches) {
                            caches.keys().then(names => {
                                for (let name of names) caches.delete(name);
                            });
                        }
                        // Recargar una vez para asegurar limpieza total si fuera necesario
                        // location.reload(); 
                    });
                }
            });
        }
    </script>
</body>
</html>
